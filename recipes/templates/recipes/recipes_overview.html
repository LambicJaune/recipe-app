<!DOCTYPE html>
<html lang="en">

<head>
    {% load static %}
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe App - Overview List</title>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'recipes/styles.css' %}">
</head>

<body>
    <header class="header">
        <div class="header-left">Recipe App</div>
        <div class="header-right">Overview List</div>
    </header>

    <main class="main-content overview-page">
        <h1>THE RECIPES</h1>
        <p>Browse through our collection of delicious recipes.</p><br>
        <div class="recipe-grid">
            {% for object in object_list %}
            <div class="recipe-item">
                <a href="{{ object.get_absolute_url }}">
                    <div class="recipe-image-container">
                        <img src="{{ object.pic.url }}" alt="{{ object.name }}" />
                    </div>
                    <div class="recipe-title-overlay">{{ object.name }}</div>
                </a>
            </div>
            {% endfor %}
        </div>
    </main>

    <footer class="footer">
        <p>Created for my Django project — All rights reserved.</p>
    </footer>
</body>

</html>
