<!DOCTYPE html>
<html lang="en">

<head>
    {% load static %}
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add New Recipe - Recipe App</title>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'recipes/styles.css' %}">
</head>

<body>
    <header class="header">
        <div class="header-left">Recipe App</div>
        <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
    </header>

    <main class="main-content detail-page">
        <div class="recipe-detail-card">
            <h1>Add New Recipe</h1>

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}

                <!-- Recipe Name -->
                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="{{ form.name.id_for_label }}">Recipe Name</label>
                    {{ form.name }}
                </div>

                <!-- Ingredients -->
                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="{{ form.ingredients.id_for_label }}">Ingredients</label><br>
                    {{ form.ingredients }}
                </div>

                <!-- Cooking Time -->
                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="{{ form.cooking_time.id_for_label }}">Cooking Time (minutes)</label>
                    {{ form.cooking_time }}
                </div>

                <!-- Picture -->
                <div class="form-group" style="margin-bottom: 30px;">
                    <label>Picture (optional)</label>

                    <label class="custom-file-upload">
                        Choose picture
                        {{ form.pic }}
                    </label>
                </div>


                <!-- Submit & Cancel Buttons -->
                <div class="form-group" style="display: flex; flex-direction: column; gap: 12px;">
                    <button type="submit" class="button-return-overview">Add Recipe</button>

                    <!-- Note: The Cancel button is not working, FIX IT LATER -->
                </div>
            </form>
            <a href="/overview">
                <button class="button-return-overview">Cancel</button>
            </a>
        </div>
    </main>

    <footer class="footer">
        <p>Created for my Django project — All rights reserved.</p>
    </footer>
</body>

</html>
